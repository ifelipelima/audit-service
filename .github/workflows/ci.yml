
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Ruff
        run: python -m pip install -r requirements-dev.txt

      - name: Run Ruff
        run: python -m ruff check .

  code-security:
    name: Code Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Bandit
        run: python -m pip install -r requirements-dev.txt

      - name: Run Bandit
        run: python -m bandit -r app -ll -ii

  dependency-security:
    name: Dependency Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install pip-audit
        run: python -m pip install -r requirements-dev.txt

      - name: Audit dependencies
        run: python -m pip_audit -r requirements.txt

  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: audit_user
          POSTGRES_PASSWORD: audit_test_password
          POSTGRES_DB: audit_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit_user -d audit_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_USER: audit_user
      POSTGRES_PASSWORD: audit_test_password
      POSTGRES_DB: audit_db
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      ADMIN_API_KEY: ci-test-admin-key

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Apply migrations
        run: python -m alembic upgrade head

      - name: Check migrations
        run: python -m alembic check

      - name: Run tests
        run: python -m pytest -v
